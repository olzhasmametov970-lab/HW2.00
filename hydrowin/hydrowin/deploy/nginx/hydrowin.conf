# nginx: сайт + API + web-приложение на одном VPS
# Замените hydrowin.ru на ваш домен

# Редирект www → без www
server {
    listen 80;
    listen [::]:80;
    server_name www.hydrowin.ru;
    return 301 https://hydrowin.ru$request_uri;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name hydrowin.ru api.hydrowin.ru app.hydrowin.ru;
    return 301 https://$host$request_uri;
}

# Лендинг
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hydrowin.ru;

    ssl_certificate     /etc/letsencrypt/live/hydrowin.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hydrowin.ru/privkey.pem;

    root /var/www/hydrowin/website;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }
}

# REST API
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.hydrowin.ru;

    ssl_certificate     /etc/letsencrypt/live/hydrowin.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hydrowin.ru/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Flutter Web-приложение
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.hydrowin.ru;

    ssl_certificate     /etc/letsencrypt/live/hydrowin.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hydrowin.ru/privkey.pem;

    root /var/www/hydrowin/app;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
